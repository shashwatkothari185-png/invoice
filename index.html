<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Tax Invoice</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-soft: #475569;
      --ink-muted: #64748b;
      --line: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #2563eb;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 16px 12px 60px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 640px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.02em;
    }
    .badge-paid { background: var(--success-soft); color: var(--success); }
    .badge-due { background: var(--danger-soft); color: var(--danger); }
    .badge-partial { background: var(--warn-soft); color: var(--warn); }
    .brand-title { font-size: 20px; font-weight: 850; color: var(--ink); }
    .meta-text { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-box {
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .info-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); }
    .info-val { font-size: 14px; font-weight: 750; color: var(--ink); margin-top: 2px; word-break: break-word; }
    .pay-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
    }
    .pay-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #22c55e;
      color: #0f172a;
      font-size: 16px;
      font-weight: 850;
      padding: 15px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
      margin-top: 14px;
    }
    .qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      display: inline-block;
      margin: 12px 0 6px;
    }
    .table-wrap { overflow-x: auto; margin: 12px -8px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 8px; font-weight: 750; color: var(--ink-muted); border-bottom: 2px solid var(--line); font-size: 11px; text-transform: uppercase; }
    td { padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .col-r { text-align: right; }
    .summary-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; color: var(--ink-soft); }
    .summary-total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 850; color: var(--ink); padding: 10px 0 4px; border-top: 1.5px solid var(--line); margin-top: 6px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      flex: 1;
    }
    .actions-row { display: flex; gap: 10px; margin-top: 12px; }
    @media print {
      body { background: #fff; padding: 0; }
      .card { border: none; box-shadow: none; padding: 0; }
      .pay-card, .actions-row { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div style="text-align:center; padding: 40px 20px;">
      <div style="font-size: 28px; margin-bottom: 10px;">⏳</div>
      <div style="font-size: 16px; font-weight: 750;">Loading official tax invoice...</div>
    </div>
  </div>

  <script>
    function decodeInvoicePayload(b64) {
      try {
        let str = b64.replace(/-/g, "+").replace(/_/g, "/");
        while (str.length % 4) str += "=";
        const decoded = decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
          return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(""));
        return JSON.parse(decoded);
      } catch (e) {
        return null;
      }
    }

    function formatMoney(num) {
      return Number(num || 0).toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    }

    function formatDate(str) {
      if(!str) return "-";
      try {
        const d = new Date(str);
        if(isNaN(d.getTime())) return str;
        return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
      } catch(e) { return str; }
    }

    function generateQrDataUri(text) {
      return "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(text);
    }

    function renderInvoice() {
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      const rawData = params.get("inv") || params.get("data");

      if (!rawData) {
        document.getElementById("app").innerHTML = `
          <div class="card" style="text-align:center; padding: 40px 20px;">
            <div style="font-size: 36px; margin-bottom: 12px;">📄</div>
            <div style="font-size: 18px; font-weight: 850;">Invoice Link Not Found</div>
            <div style="font-size: 13px; color: var(--ink-muted); margin-top: 6px;">Please open the full link received on WhatsApp or contact the store.</div>
          </div>
        `;
        return;
      }

      const inv = decodeInvoicePayload(rawData);
      if (!inv) {
        document.getElementById("app").innerHTML = `
          <div class="card" style="text-align:center; padding: 40px 20px;">
            <div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>
            <div style="font-size: 18px; font-weight: 850;">Invalid or Expired Invoice Data</div>
            <div style="font-size: 13px; color: var(--ink-muted); margin-top: 6px;">The invoice link appears corrupted. Please request a fresh bill from the store.</div>
          </div>
        `;
        return;
      }

      const shop = inv.s || {};
      const cust = inv.c || {};
      const items = inv.items || [];
      const billNo = inv.b || "-";
      const billDate = formatDate(inv.d);
      const total = Number(inv.t || 0);
      const paid = Number(inv.p || 0);
      const balDue = Math.max(0, total - paid);
      const isPaid = balDue <= 0.009;

      const upiId = shop.upi || "";
      const shopName = shop.n || "OnePiece Store";
      const upiLink = upiId ? `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(shopName)}&am=${balDue.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Payment for Invoice #' + billNo)}` : "";

      let statusBadge = isPaid
        ? `<span class="badge badge-paid">✓ Fully Paid &amp; Settled</span>`
        : (paid > 0
            ? `<span class="badge badge-partial">⚠️ Partially Paid · ₹${formatMoney(balDue)} Due</span>`
            : `<span class="badge badge-due">⚠️ Unpaid · ₹${formatMoney(balDue)} Due</span>`);

      let html = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
            <div>
              <div class="brand-title">${shop.n || "RETAIL STORE"}</div>
              ${shop.a ? `<div class="meta-text">${shop.a}</div>` : ""}
              <div class="meta-text" style="margin-top:4px;">
                ${shop.p ? `<span>📞 ${shop.p}</span>` : ""}
                ${shop.g ? `<span style="margin-left:8px;">GSTIN: <b>${shop.g}</b></span>` : ""}
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:11px; font-weight:750; color:var(--ink-muted); text-transform:uppercase;">Tax Invoice</div>
              <div style="font-size:18px; font-weight:850; color:var(--ink);">#${billNo}</div>
              <div style="margin-top:4px;">${statusBadge}</div>
            </div>
          </div>
        </div>
      `;

      if (!isPaid && upiId) {
        html += `
          <div class="pay-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <div style="font-size:12px; font-weight:700; text-transform:uppercase; color:#94a3b8;">Payment Due</div>
                <div style="font-size:26px; font-weight:900; color:#ffffff; margin-top:2px;">₹${formatMoney(balDue)}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:11px; color:#cbd5e1;">Payee UPI ID</div>
                <div style="font-size:12.5px; font-weight:750; color:#38bdf8;">${upiId}</div>
              </div>
            </div>

            <div style="text-align:center; margin-top:14px;">
              <div class="qr-container">
                <img src="${generateQrDataUri(upiLink)}" alt="Scan to Pay UPI" style="width:140px; height:140px; display:block;">
              </div>
              <div style="font-size:11px; color:#cbd5e1; margin-top:4px;">Auto-Note: <b>Payment for Invoice #${billNo}</b> · Scan with GPay, PhonePe, Paytm</div>
            </div>

            <a href="${upiLink}" class="pay-btn">
              <span>💳 Pay ₹${formatMoney(balDue)} via UPI</span>
            </a>
          </div>
        `;
      }

      html += `
        <div class="card">
          <div class="grid2">
            <div class="info-box">
              <div class="info-label">Invoice Date</div>
              <div class="info-val">${billDate}</div>
            </div>
            <div class="info-box">
              <div class="info-label">Payment Mode</div>
              <div class="info-val" style="text-transform:capitalize;">${inv.m || "Cash"}</div>
            </div>
          </div>

          <div class="info-box" style="margin-top:10px;">
            <div class="info-label">Billed To (Customer)</div>
            <div class="info-val">${cust.n || "Retail Customer"} ${cust.p ? `<span style="font-size:12.5px; color:var(--ink-muted);">(${cust.p})</span>` : ""}</div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:28px;">#</th>
                  <th>Item Details</th>
                  <th class="col-r" style="width:40px;">Qty</th>
                  <th class="col-r" style="width:75px;">Rate</th>
                  <th class="col-r" style="width:85px;">Amount</th>
                </tr>
              </thead>
              <tbody>
                ${items.map((it, idx) => `
                  <tr>
                    <td style="color:var(--ink-muted); font-size:11px;">${idx + 1}</td>
                    <td><div style="font-weight:750; color:var(--ink);">${it.d || "Goods"}</div></td>
                    <td class="col-r" style="font-weight:600;">${it.q || 1}</td>
                    <td class="col-r">₹${formatMoney(it.r || 0)}</td>
                    <td class="col-r" style="font-weight:750;">₹${formatMoney(it.a || (it.q||1)*(it.r||0))}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>

          <div style="margin-top:14px; padding-top:10px; border-top:1px solid var(--line);">
            <div class="summary-row">
              <span>Bill Subtotal</span>
              <span>₹${formatMoney(total)}</span>
            </div>
            <div class="summary-row">
              <span>Amount Paid</span>
              <span style="color:var(--success); font-weight:700;">₹${formatMoney(paid)}</span>
            </div>
            <div class="summary-total">
              <span>Balance Due</span>
              <span style="color:${isPaid ? 'var(--success)' : 'var(--danger)'};">₹${formatMoney(balDue)}</span>
            </div>
          </div>

          <div class="actions-row">
            <button class="btn" onclick="window.print()">
              <span>🖨 Print Bill</span>
            </button>
            <button class="btn" style="background:#0f172a; color:#ffffff; border-color:#0f172a;" onclick="window.print()">
              <span>⬇ Download PDF</span>
            </button>
          </div>
        </div>

        <div style="text-align:center; font-size:11.5px; color:var(--ink-muted); margin-top:20px;">
          Thank you for shopping with us! · Generated securely by OnePiece Books
        </div>
      `;

      document.getElementById("app").innerHTML = html;
    }

    window.addEventListener("DOMContentLoaded", renderInvoice);
    window.addEventListener("hashchange", renderInvoice);
  </script>
</body>
</html>
